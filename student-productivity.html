<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Productivity App | ALKA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            font-family: Arial, sans-serif;
        }

        .case-nav {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            background: #080808;
        }

        .logo {
            color: #f2f0ea;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
        }

        .logo span {
            color: #a58cff;
        }

        .back-btn {
            color: #f2f0ea;
            text-decoration: none;
            border: 1px solid #444;
            padding: 12px 20px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #a58cff;
            color: #080808;
            border-color: #a58cff;
        }

        .case-study {
            width: 100%;
            display: flex;
            justify-content: center;
            background: #080808;
        }

        .case-study img {
            width: 100%;
            max-width: 1440px;
            height: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .case-nav {
                height: 65px;
                padding: 0 4%;
            }

            .case-study img {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav class="case-nav">
        <a href="index.html" class="logo">ALKA<span>.</span></a>
        <a href="index.html#projects" class="back-btn">← Back to Projects</a>
    </nav>

    <main class="case-study">
        <img src="images/student-case-study.png"
             alt="Student Productivity App UI UX Case Study">
    </main>

</body>
</html>
